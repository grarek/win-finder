name: Build and release

# Every push to main (i.e. every merged PR) builds, tests and publishes a new
# GitHub Release marked "Latest", with x64 and ARM64 zips attached.
# Pull requests run the same build and tests (and upload the zips as artifacts)
# but don't create a release, so problems show up before merging.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create releases and tags

concurrency:
  # Releases from main queue up and never cancel; superseded PR builds are cancelled.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'release-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags: release notes and version numbering need them

      # Releases are numbered one after another: the highest vX.Y.Z tag plus one (v1.0.8 -> v1.0.9).
      # Releases from main run one at a time (see concurrency), so two merges can't pick the same
      # number; a re-run of a commit that was already released reuses its version.
      - name: Work out the version
        shell: pwsh
        run: |
          $reuse = '${{ github.event_name }}' -ne 'pull_request'
          $version = if ($reuse) { ./tools/next-version.ps1 -ReuseExisting } else { ./tools/next-version.ps1 }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected version '$version'" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version: $version"

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        shell: pwsh
        run: dotnet test tests/WinFinder.Core.Tests -c Release --logger "console;verbosity=normal"

      # "dotnet publish" only compiles a ready-to-run app folder; nothing is released here.
      - name: Build x64 and ARM64 app packages
        shell: pwsh
        run: |
          $targets = @(
            @{ Rid = 'win-x64';   Platform = 'x64'   },
            @{ Rid = 'win-arm64'; Platform = 'ARM64' }
          )
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($t in $targets) {
            $out = "publish/$($t.Rid)"
            dotnet publish src/WinFinder.App -c Release -r $t.Rid "-p:Platform=$($t.Platform)" `
              -p:PublishReadyToRun=true "-p:Version=$env:VERSION" -o $out
            if ($LASTEXITCODE -ne 0) { throw "publish failed for $($t.Rid)" }
            if (-not (Test-Path "$out/WinFinder.exe")) { throw "WinFinder.exe missing for $($t.Rid)" }
            Compress-Archive -Path "$out/*" -DestinationPath "dist/WinFinder-$env:VERSION-$($t.Rid).zip"
          }
          Get-ChildItem dist | Format-Table Name, Length

      # Wraps each app folder in a Setup.exe (Inno Setup; see installer/WinFinder.iss).
      - name: Build x64 and ARM64 installers
        shell: pwsh
        run: |
          $iscc = @(
            (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source,
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Couldn't install Inno Setup" }
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          foreach ($arch in 'x64', 'arm64') {
            $source = (Resolve-Path "publish/win-$arch").Path
            & $iscc /Q "/DAppVersion=$env:VERSION" "/DArch=$arch" "/DSourceDir=$source" "/DOutputDir=$PWD\dist" installer/WinFinder.iss
            if ($LASTEXITCODE -ne 0) { throw "Installer build failed for $arch" }
          }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Attach test builds to this run (pull requests only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: WinFinder-pr-${{ github.event.pull_request.number }}
          path: |
            dist/*.zip
            dist/*.exe
          retention-days: 7

      - name: Create GitHub release (main only)
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $notes = @"
          Built from $env:GITHUB_SHA.

          **Install:** download and run the setup for your PC: ``WinFinder-$env:VERSION-setup-x64.exe`` for most PCs, or ``-setup-arm64.exe`` for Snapdragon / Surface Pro X. No admin rights needed; it adds WinFinder to the Start Menu and to Apps > Installed apps. Already installed? WinFinder updates itself.

          The zips are the same app without an installer: extract anywhere and run ``WinFinder.exe``.

          The build isn't code-signed, so Windows SmartScreen may warn: choose **More info → Run anyway**.
          "@
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in '.zip', '.exe' } | ForEach-Object FullName)
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # Re-run of a commit that was already released: refresh the assets instead of failing.
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --target $env:GITHUB_SHA --title "WinFinder $env:VERSION" `
              --notes $notes --generate-notes --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }
